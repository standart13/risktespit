<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSE Risk Analizi</title>
    
    <style>
        /* --- LIGHT MODE APP TASARIM SİSTEMİ --- */
        :root {
            --bg-base: #F2F2F7;          /* iOS Sistem Grisi Arka Plan */
            --bg-card: #FFFFFF;          /* Saf Beyaz Kartlar */
            --bg-input: #F4F4F5;         /* Hafif Gri Input */
            --ios-blue: #007AFF;         /* Apple Mavi Accent */
            --text-main: #1C1C1E;        /* Koyu Metin */
            --text-muted: #8E8E93;       /* Gri Alt Metin */
            --danger: #FF3B30;           /* Kırmızı Uyarı */
            --success: #34C759;          /* Yeşil Başarı */
            --radius-lg: 20px;           
            --radius-md: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* KESİNLİKLE KAYDIRMAZ ANA GÖVDE (Tek Ekran Uygulama) */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh; /* Ekranın %100'ü */
            height: 100dvh; /* Dinamik mobil ekran boyutu */
            overflow: hidden; /* Dış ekran kaydırması tamamen kapalı */
            display: flex;
            justify-content: center;
        }

        .app-container { 
            width: 100%;
            max-width: 500px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-base);
        }

        #riskForm {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Form dışı taşmaları engeller */
        }

        /* SADECE İÇERİK ALANI KAYAR */
        .page { 
            display: none; 
            flex: 1;
            overflow-y: auto; /* Kartların olduğu alan içten kayar */
            padding: 24px 20px 100px 20px; /* Alttaki yüzen menü için boşluk bırakıldı */
            scrollbar-width: none;
        }
        .page::-webkit-scrollbar { display: none; }
        
        .page.active { 
            display: block; 
            animation: fadeIn 0.3s ease forwards; 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); } 
        }

        /* BAŞLIKLAR */
        .header-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
        }
        .header-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 20px 0;
            font-weight: 500;
        }

        /* KART YAPISI (Orijinal koddaki .dynamic-section mantığı) */
        .dynamic-section, .widget-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #E5E5EA;
        }

        /* INPUTLAR VE LABELLAR */
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            margin-top: 16px;
            margin-left: 4px;
        }
        label:first-child { margin-top: 0; }

        input, select, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 2px solid transparent; 
            color: var(--text-main);
            font-size: 15px;
            font-family: inherit;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
            appearance: none; 
        }
        
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%238E8E93%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--ios-blue);
            background-color: #FFFFFF;
        }

        /* KÜÇÜK VE ESTETİK FOTOĞRAF YÜKLEME ALANI */
        .photo-upload-widget {
            background-color: var(--bg-input);
            border: 1px dashed #C7C7CC;
            border-radius: var(--radius-md);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }
        .photo-upload-widget.foto-yuklendi {
            border-style: solid;
            border-color: var(--success);
            background-color: rgba(52, 199, 89, 0.05);
        }
        .photo-upload-widget input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .photo-icon {
            width: 32px; height: 32px;
            background: #E5E5EA;
            color: var(--text-main);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .foto-yuklendi .photo-icon {
            background: var(--success);
            color: white;
        }

        /* BUTONLAR */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px; 
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background-color: var(--ios-blue); color: #FFFFFF; }
        .btn-secondary { background-color: #E5E5EA; color: var(--text-main); margin-top: 10px;}
        .btn-ai { background-color: #F3F0F9; color: #6F42C1; border: 1px solid #D1C4E9; margin-bottom: 24px;}
        
        /* Orijinal btn-remove mantığı */
        .btn-remove { 
            background-color: rgba(255, 59, 48, 0.1); 
            color: var(--danger); 
            padding: 6px 12px; 
            width: auto; 
            font-size: 12px; 
            position: absolute; 
            top: 16px; 
            right: 16px; 
            border-radius: 8px;
        }

        /* YÜZEN NAVİGASYON (Alt Bar) */
        .floating-nav {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            padding: 6px;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 1000;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .nav-item {
            padding: 10px 20px;
            border-radius: 100px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-item.active {
            background-color: var(--ios-blue);
            color: #FFFFFF;
        }

        /* GRID YAPISI */
        .row { display: flex; gap: 12px; width: 100%; }
        .col { flex: 1; min-width: 0; }
        
        /* SKOR RENKLERİ (Orijinal risk-yuksek sınıfı) */
        .skor-input.risk-yuksek { color: var(--danger) !important; font-weight: 800; background: rgba(255, 59, 48, 0.1); border-color: var(--danger); }
        
        /* AI ÖNERİLERİ */
        #aiSuggestions { display: none; margin-bottom: 24px; }
        .suggestion-item {
            background: #F2F2F7;
            color: var(--ios-blue);
            padding: 8px 14px;
            border-radius: 100px;
            display: inline-block;
            margin: 4px 4px 0 0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <form id="riskForm" onsubmit="event.preventDefault();">
        
        <div id="page1" class="page active">
            <h1 class="header-title">Lokasyon</h1>
            <p class="header-subtitle">Departman ve posta bilgileri.</p>
            
            <div class="widget-card">
                <label for="departman">Departman</label>
                <select id="departman" required>
                    <option value="" disabled selected>Seçiniz</option>
                    <option value="Dökümhane">Dökümhane</option>
                    <option value="Motor">Motor</option>
                    <option value="Vites Kutusu">Vites Kutusu</option>
                    <option value="Lojistik">Lojistik</option>
                </select>

                <div class="row">
                    <div class="col">
                        <label for="atolye">Atölye</label>
                        <input type="text" id="atolye" required placeholder="Giriş yapın">
                    </div>
                    <div class="col">
                        <label for="uet">UET</label>
                        <input type="text" id="uet" required placeholder="Giriş yapın">
                    </div>
                </div>

                <label for="posta">Posta</label>
                <input type="text" id="posta" required placeholder="Posta adı veya numarası">
            </div>

            <div class="widget-card">
                <label for="postaFoto">Posta Fotoğrafı</label>
                <div class="photo-upload-widget" id="mainPhotoWidget">
                    <div class="photo-icon">📷</div>
                    <div style="flex: 1;">
                        <div id="mainPhotoText" style="font-weight: 600; font-size: 14px; color: var(--text-main);">Fotoğraf Seç / Çek</div>
                    </div>
                    <input type="file" id="postaFoto" accept="image/*" onchange="arayuzGuncelle(this, 'mainPhotoWidget', 'mainPhotoText')">
                </div>
            </div>

            <button type="button" id="aiBtn" class="btn-ai" onclick="aiAnalizEt()">
                ✨ AI ile Riskleri Analiz Et
            </button>

            <div id="aiSuggestions">
                <label style="color: #6F42C1;">Gemini Tespitleri (Eklemek için tıklayın):</label>
                <div id="suggestionList"></div>
            </div>
        </div>

        <div id="page2" class="page">
            <h1 class="header-title">Önlemler</h1>
            <p class="header-subtitle">Mevcut güvenlik donanımları ve kurallar.</p>
            
            <div id="guvenlikOnlemleriContainer"></div>
            
            <button type="button" class="btn-secondary" onclick="addGuvenlikOnlemi()">+ Yeni Önlem Ekle</button>
        </div>

        <div id="page3" class="page">
            <h1 class="header-title">Riskler</h1>
            <p class="header-subtitle">Risk skorlaması ve aksiyon atamaları.</p>
            
            <div id="risklerContainer"></div>
            
            <button type="button" class="btn-secondary" onclick="addRisk()" style="margin-bottom: 24px;">+ Yeni Risk Ekle</button>
            
            <button type="button" class="btn-primary" onclick="submitForm()">
                Kaydet
            </button>
        </div>

    </form>

    <div class="floating-nav">
        <div class="nav-item active" id="nav1" onclick="switchPage(1)">Lokasyon</div>
        <div class="nav-item" id="nav2" onclick="switchPage(2)">Önlemler</div>
        <div class="nav-item" id="nav3" onclick="switchPage(3)">Riskler</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzJkHDsItLE1OT-1mqHcVCKKdEkbyPzxDeU38Mw0ipw0-LK-zkD-EVR31puLVlk5WTr/exec";

    // --- NAVİGASYON MANTIĞI ---
    function switchPage(pageNumber) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const activePage = document.getElementById('page' + pageNumber);
        activePage.classList.add('active');
        activePage.scrollTop = 0; // İçeriği en başa kaydırır
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('nav' + pageNumber).classList.add('active');
    }

    // --- FOTOĞRAF ARAYÜZ GÜNCELLEYİCİ ---
    function arayuzGuncelle(inputElement, widgetId, textId) {
        // Eğer widget ID'si verildiyse o widget'ı bul, yoksa bir üst elemanı al (dinamik olanlar için)
        const widget = widgetId ? document.getElementById(widgetId) : inputElement.parentElement;
        const textElement = textId ? document.getElementById(textId) : widget.querySelector('.upload-text');
        
        if (inputElement.files && inputElement.files.length > 0) {
            widget.classList.add('foto-yuklendi');
            if(textElement) textElement.innerText = "Görsel Yüklendi ✓";
            // Checkmark ikonu ataması
            const icon = widget.querySelector('.photo-icon');
            if(icon) icon.innerText = "✓";
        } else {
            widget.classList.remove('foto-yuklendi');
            if(textElement) textElement.innerText = "Fotoğraf Seç / Çek";
            const icon = widget.querySelector('.photo-icon');
            if(icon) icon.innerText = "📷";
        }
    }

    // --- AI ANALİZ ---
    async function aiAnalizEt() {
        const fileInput = document.getElementById('postaFoto');
        if (!fileInput.files[0]) {
            alert("Önce bir fotoğraf çekmelisiniz.");
            return;
        }

        const aiBtn = document.getElementById('aiBtn');
        const aiContainer = document.getElementById('aiSuggestions');
        const list = document.getElementById('suggestionList');
        
        aiBtn.disabled = true;
        aiBtn.innerText = "Analiz Ediliyor...";
        
        try {
            const b64 = await processImage(fileInput.files[0]);
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "analyzeImage", imageB64: b64 })
            });
            const result = await response.json();

            if (result.status === "success") {
                list.innerHTML = "";
                result.data.forEach(risk => {
                    const span = document.createElement('span');
                    span.className = "suggestion-item";
                    span.innerText = risk;
                    span.onclick = () => {
                        addRisk(risk);
                        span.style.opacity = "0.5";
                        span.style.pointerEvents = "none";
                    };
                    list.appendChild(span);
                });
                aiContainer.style.display = "block";
            } else {
                alert("Analiz hatası: " + result.message);
            }
        } catch (e) {
            alert("Bağlantı hatası.");
        } finally {
            aiBtn.disabled = false;
            aiBtn.innerText = "✨ AI ile Riskleri Analiz Et";
        }
    }

    // --- 2. SAYFA: ÖNLEM EKLEME (Orijinal sınıflarla) ---
    function addGuvenlikOnlemi() {
        const container = document.getElementById('guvenlikOnlemleriContainer');
        const sectionHTML = `
            <div class="dynamic-section">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">Sil</button>
                
                <label>Mevcut Güvenlik Önlemleri Açıklaması</label>
                <textarea class="guvenlik-aciklama" rows="3" required placeholder="Açıklama giriniz..."></textarea>
                
                <label>Güvenlik Önlemi Fotoğrafı</label>
                <div class="photo-upload-widget">
                    <div class="photo-icon">📷</div>
                    <div class="upload-text" style="font-weight: 600; font-size: 14px;">Fotoğraf Seç / Çek</div>
                    <input type="file" class="guvenlik-foto" accept="image/*" onchange="arayuzGuncelle(this)">
                </div>

                <label>Giderilen Riskler</label>
                <textarea class="giderilen-riskler" rows="2" required placeholder="Hangi riskleri gideriyor?"></textarea>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', sectionHTML);
    }

    // --- 3. SAYFA: RİSK EKLEME (Orijinal sınıflarla) ---
    function addRisk(aiText = "") {
        const container = document.getElementById('risklerContainer');
        const sectionHTML = `
            <div class="dynamic-section">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">Sil</button>
                
                <label>Mevcut Riskler ve Açıklaması</label>
                <textarea class="risk-aciklama" rows="3" required placeholder="Riski tanımlayın...">${aiText}</textarea>
                
                <label>Risk Fotoğrafı</label>
                <div class="photo-upload-widget">
                    <div class="photo-icon">📷</div>
                    <div class="upload-text" style="font-weight: 600; font-size: 14px;">Fotoğraf Seç / Çek</div>
                    <input type="file" class="risk-foto" accept="image/*" onchange="arayuzGuncelle(this)">
                </div>

                <div class="row">
                    <div class="col">
                        <label>Olasılık (1-5)</label>
                        <input type="number" class="olasilik-input" min="1" max="5" oninput="hesaplaDinamikSkor(this)" required>
                    </div>
                    <div class="col">
                        <label>Şiddet (1-5)</label>
                        <input type="number" class="siddet-input" min="1" max="5" oninput="hesaplaDinamikSkor(this)" required>
                    </div>
                    <div class="col">
                        <label>Risk Skoru</label>
                        <input type="text" class="skor-input" readonly placeholder="-">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Aksiyon Sorumlusu</label>
                        <input type="text" class="sorumlu-input" required placeholder="Ad Soyad">
                    </div>
                    <div class="col">
                        <label>Aksiyon Tarihi</label>
                        <input type="date" class="tarih-input" required>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', sectionHTML);
        if(aiText !== "") {
            switchPage(3); // AI'dan gelirse 3. sekmeye yönlendir
        }
    }

    // --- SKOR HESAPLAMA ---
    function hesaplaDinamikSkor(element) {
        const section = element.closest('.dynamic-section');
        const olasilik = section.querySelector('.olasilik-input').value;
        const siddet = section.querySelector('.siddet-input').value;
        const skorInput = section.querySelector('.skor-input');
        if(olasilik && siddet) {
            const skor = olasilik * siddet;
            skorInput.value = skor;
            if(skor > 9) skorInput.classList.add('risk-yuksek');
            else skorInput.classList.remove('risk-yuksek');
        } else {
            skorInput.value = '';
            skorInput.classList.remove('risk-yuksek');
        }
    }

    // --- FOTOĞRAF İŞLEME ---
    async function processImage(file) {
        if (!file) return null;
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    // --- FORM GÖNDERME (Orijinal koddaki submit mantığı %100 korundu) ---
    async function submitForm() {
        const submitBtn = document.querySelector('button[onclick="submitForm()"]');
        submitBtn.disabled = true;
        submitBtn.innerText = "Gönderiliyor...";
        try {
            const payload = {
                departman: document.getElementById('departman').value,
                atolye: document.getElementById('atolye').value,
                uet: document.getElementById('uet').value,
                posta: document.getElementById('posta').value,
                postaFoto: await processImage(document.getElementById('postaFoto').files[0]),
                guvenlikOnlemleri: [],
                riskler: []
            };
            
            document.querySelectorAll('#guvenlikOnlemleriContainer .dynamic-section').forEach(sec => {
                payload.guvenlikOnlemleri.push({
                    aciklama: sec.querySelector('.guvenlik-aciklama').value,
                    giderilenRiskler: sec.querySelector('.giderilen-riskler').value,
                    foto: null // Orijinal koddaki gibi null bırakıldı
                });
            });
            
            document.querySelectorAll('#risklerContainer .dynamic-section').forEach(sec => {
                payload.riskler.push({
                    aciklama: sec.querySelector('.risk-aciklama').value,
                    olasilik: sec.querySelector('.olasilik-input').value,
                    siddet: sec.querySelector('.siddet-input').value,
                    skor: sec.querySelector('.skor-input').value,
                    sorumlu: sec.querySelector('.sorumlu-input').value,
                    tarih: sec.querySelector('.tarih-input').value,
                    foto: null // Orijinal koddaki gibi null bırakıldı
                });
            });
            
            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            
            if (result.status === "success") {
                alert("Başarıyla kaydedildi.");
                window.location.reload();
            } else {
                alert("Hata: " + result.message);
            }
        } catch (e) { 
            alert("Hata oluştu."); 
        } finally { 
            submitBtn.disabled = false; 
            submitBtn.innerText = "Kaydet"; 
        }
    }

    window.onload = () => { addGuvenlikOnlemi(); addRisk(); };
</script>
</body>
</html>
