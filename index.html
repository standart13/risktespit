<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSE Risk Intelligence</title>
    <style>
        :root {
            --bg-base: #F2F2F7;
            --bg-card: #FFFFFF;
            --bg-input: #F4F4F5;
            --ios-blue: #007AFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --danger: #FF3B30;
            --success: #34C759;
            --radius-lg: 20px;           
            --radius-md: 12px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* 1. UYGULAMA GÖVDESİ (Sıfır Esneme, Tam Ekran) */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            overscroll-behavior-y: none; 
            display: flex;
            justify-content: center;
        }

        .app-container { 
            width: 100%;
            max-width: 500px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #riskForm { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* 2. SAYFALAR (Sadece içerik uzarsa kaydırılabilir) */
        .page { 
            display: none; 
            flex: 1;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding: 16px 16px 80px 16px; 
            scrollbar-width: none;
        }
        .page::-webkit-scrollbar { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Başlıklar */
        .header-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .header-subtitle { font-size: 13px; color: var(--text-muted); margin: 4px 0 16px 0; font-weight: 500; }

        /* Kartlar ve Dinamik Bölümler */
        .widget-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #E5E5EA;
        }

        .dynamic-section {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 36px 16px 16px 16px; 
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #E5E5EA;
        }

        /* Etiketler (Labels) */
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            margin-top: 14px;
            margin-left: 4px;
        }
        
        .widget-card > label:first-child,
        .dynamic-section > label:first-of-type { 
            margin-top: 0; 
        }

        /* Girdi Alanları */
        input, select, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 2px solid transparent; 
            color: var(--text-main);
            font-size: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s;
            appearance: none;
            margin: 0; 
            font-family: inherit;
        }

        textarea { height: 60px; resize: none; } 

        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%238E8E93%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--ios-blue); background-color: #FFFFFF; }

        /* Fotoğraf Yükleme Widget */
        .photo-upload-widget {
            background-color: var(--bg-input);
            border: 1px dashed #C7C7CC;
            border-radius: var(--radius-md);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .photo-upload-widget.foto-yuklendi { border-style: solid; border-color: var(--success); background-color: rgba(52, 199, 89, 0.05); }
        .photo-upload-widget input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .photo-icon { width: 28px; height: 28px; background: #E5E5EA; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .foto-yuklendi .photo-icon { background: var(--success); color: white; }

        /* Butonlar */
        button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: var(--ios-blue); color: #FFFFFF; }
        .btn-secondary { background-color: #E5E5EA; color: var(--text-main); margin-bottom: 12px; }
        .btn-ai { background-color: #F3F0F9; color: #6F42C1; border: 1px solid #D1C4E9; margin-top: 16px; margin-bottom: 16px; }
        
        .btn-remove { 
            background-color: rgba(255, 59, 48, 0.1); 
            color: var(--danger); 
            padding: 6px 12px; 
            width: auto; 
            font-size: 12px; 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            border-radius: 8px; 
        }

        /* Alt Navigasyon Menüsü */
        .floating-nav {
            position: absolute; 
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            padding: 6px;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .nav-item { padding: 10px 20px; border-radius: 100px; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; }
        .nav-item.active { background-color: var(--ios-blue); color: #FFFFFF; }

        /* Grid ve Yardımcı Sınıflar */
        .row { display: flex; gap: 10px; width: 100%; }
        .col { flex: 1; min-width: 0; }
        .skor-input.risk-yuksek { color: var(--danger) !important; font-weight: 800; background: rgba(255, 59, 48, 0.1); }
        
        /* AI Öneri Kutuları */
        #aiSuggestions { 
            display: none; 
            margin-bottom: 16px; 
            background-color: #F8F9FA; 
            padding: 14px; 
            border-radius: var(--radius-md); 
            border: 1px solid #E5E5EA; 
        }
        #aiSuggestions label { 
            color: var(--text-main); 
            font-size: 13px; 
            margin-bottom: 12px; 
            margin-top: 0;
            display: block; 
        }
        .suggestion-item { 
            background: #FFFFFF; 
            color: var(--ios-blue); 
            padding: 12px 14px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            border: 1px solid #CCE0FF;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .suggestion-item:last-child { margin-bottom: 0; }
        .suggestion-item span { color: var(--success); font-weight: 800; font-size: 12px; }

        /* YÜKLEME EKRANI (LOADING OVERLAY) */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            max-width: 300px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #E5E5EA;
            border-top-color: var(--ios-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            text-align: center;
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #E5E5EA;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--ios-blue);
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <div id="loadingText" class="loading-text">İşlem Yapılıyor...</div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <form id="riskForm">
        
        <div id="page1" class="page active">
            <h1 class="header-title">Lokasyon</h1>
            <p class="header-subtitle">Departman ve hiyerarşi bilgilerini belirleyin.</p>
            
            <div class="widget-card">
                <label for="departman">Departman</label>
                <select id="departman" onchange="updateHiyerarşi('atolye')" required>
                    <option value="" disabled selected>Seçiniz</option>
                    <option value="Motor">Motor</option>
                    <option value="Dökümhane">Dökümhane</option>
                    <option value="Vites Kutusu">Vites Kutusu</option>
                    <option value="Lojistik">Lojistik</option>
                    <option value="Bakım">Bakım</option>
                    <option value="Ar-Ge">Ar-Ge</option>
                </select>

                <div class="row">
                    <div class="col">
                        <label for="atolye">Atölye</label>
                        <select id="atolye" onchange="updateHiyerarşi('uet')" required>
                            <option value="" disabled selected>Önce Dep.</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="uet">UET</label>
                        <select id="uet" required>
                            <option value="" disabled selected>Önce Atölye</option>
                        </select>
                    </div>
                </div>

                <label for="posta">Posta</label>
                <input type="text" id="posta" required placeholder="Giriş yapın">
            </div>

            <div class="widget-card">
                <label for="postaFoto">Posta Fotoğrafı</label>
                <div class="photo-upload-widget" id="mainPhotoWidget">
                    <div class="photo-icon">📷</div>
                    <div style="flex: 1;"><div class="upload-text" style="font-weight: 600; font-size: 13px;">Fotoğraf Seç / Çek</div></div>
                    <input type="file" id="postaFoto" accept="image/*" onchange="arayuzGuncelle(this, 'mainPhotoWidget')">
                </div>
            </div>

            <button type="button" id="aiBtn" class="btn-ai" onclick="aiAnalizEt()">✨ AI ile Analiz Başlat</button>
            <div id="aiSuggestions">
                <label>Gemini Tespitleri:</label>
                <div id="suggestionList"></div>
            </div>
        </div>

        <div id="page2" class="page">
            <h1 class="header-title">Mevcut Güvenlik Önlemleri</h1>
            <p class="header-subtitle">İş yerindeki mevcut koruyucu sistemleri girin.</p>
            <div id="guvenlikOnlemleriContainer"></div>
            <button type="button" class="btn-secondary" onclick="addGuvenlikOnlemi()">+ Yeni Güvenlik Önlemi Ekle</button>
        </div>

        <div id="page3" class="page">
            <h1 class="header-title">Risk Analizi ve Aksiyonlar</h1>
            <p class="header-subtitle">Riskleri puanlayın ve aksiyon planı oluşturun.</p>
            <div id="risklerContainer"></div>
            
            <button type="button" class="btn-secondary" onclick="addRisk()">+ Yeni Risk Ekle</button>
            <button type="button" class="btn-primary" onclick="submitForm()">Sisteme Kaydet</button>
        </div>
    </form>

    <div class="floating-nav">
        <div class="nav-item active" id="nav1" onclick="switchPage(1)">Lokasyon</div>
        <div class="nav-item" id="nav2" onclick="switchPage(2)">Önlemler</div>
        <div class="nav-item" id="nav3" onclick="switchPage(3)">Riskler</div>
    </div>
</div>

<script>
    // WEB APP URL'NİZ BURAYA GELECEK
    const API_URL = "https://script.google.com/macros/s/AKfycbzJkHDsItLE1OT-1mqHcVCKKdEkbyPzxDeU38Mw0ipw0-LK-zkD-EVR31puLVlk5WTr/exec";

    // Hiyerarşi Verisi (Vites Kutusu Atölye 1 ve Atölye 2 güncellemeli)
    const hiyerarşi = {
        "Motor": { "2C": ["Külas", "Krank", "Bakım"], "MM11": ["Giydirme", "Baz", "Sıcak Deneme", "Bakım"] },
        "Dökümhane": { "Döküm": ["Bakım", "Kalıp Bakım", "İşleme İmalat"], "İşleme": ["Motor Bloğu", "Volan Biyel", "Bakım"] },
        "Vites Kutusu": { "Atölye 1": ["Montaj", "Karter", "Isıl İşlem"], "Atölye 2": ["Bakım", "Dişli", "Mil"] },
        "Lojistik": { "İç Akışlar": ["İç Akışlar"], "Sevkiyat": ["Sevkiyat"] },
        "Bakım": { "MRO Ambar": ["Ambar"], "Bileme": ["Bileme"] },
        "Ar-Ge": { "Motor Deneme": ["Deneme"] }
    };

    function updateHiyerarşi(type) {
        const dep = document.getElementById('departman').value;
        const atolyeSelect = document.getElementById('atolye');
        const uetSelect = document.getElementById('uet');
        if (type === 'atolye') {
            atolyeSelect.innerHTML = '<option value="" disabled selected>Seçiniz</option>';
            uetSelect.innerHTML = '<option value="" disabled selected>Önce Atölye</option>';
            Object.keys(hiyerarşi[dep]).forEach(a => atolyeSelect.add(new Option(a, a)));
        } else if (type === 'uet') {
            const atolye = atolyeSelect.value;
            uetSelect.innerHTML = '<option value="" disabled selected>Seçiniz</option>';
            hiyerarşi[dep][atolye].forEach(u => uetSelect.add(new Option(u, u)));
        }
    }

    function switchPage(p) {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.getElementById('page' + p).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('nav' + p).classList.add('active');
        document.getElementById('page' + p).scrollTop = 0;
    }

    function arayuzGuncelle(input, wid) {
        const w = wid ? document.getElementById(wid) : input.parentElement;
        const t = w.querySelector('.upload-text');
        if (input.files.length > 0) {
            w.classList.add('foto-yuklendi');
            if(t) t.innerText = "Yüklendi ✓";
        } else {
            w.classList.remove('foto-yuklendi');
            if(t) t.innerText = "Fotoğraf Seç / Çek";
        }
    }

    // Yükleme (Loading) Animasyonu Kontrolleri
    let progressInterval;
    function showLoading(text) {
        document.getElementById('loadingText').innerText = text;
        document.getElementById('loadingOverlay').classList.add('active');
        const bar = document.getElementById('progressBar');
        bar.style.width = '0%';
        let width = 0;
        progressInterval = setInterval(() => {
            if (width < 90) { 
                width += Math.random() * 8; 
                if (width > 90) width = 90;
                bar.style.width = width + '%'; 
            }
        }, 500);
    }

    function hideLoading() {
        clearInterval(progressInterval);
        const bar = document.getElementById('progressBar');
        bar.style.width = '100%';
        setTimeout(() => {
            document.getElementById('loadingOverlay').classList.remove('active');
            bar.style.width = '0%';
        }, 400);
    }

    // AI Analiz Fonksiyonu
    async function aiAnalizEt() {
    const file = document.getElementById('postaFoto').files[0];
    if (!file) return alert("Hata: Analiz için fotoğraf gereklidir.");
    
    showLoading("Yapay Zeka Görsel Veriyi İşliyor...");
    try {
        const b64 = await processImage(file);
        const res = await fetch(API_URL, { 
            method: 'POST', 
            body: JSON.stringify({ action: "analyzeImage", imageB64: b64 }),
            redirect: 'follow'
        });
        const result = await res.json();
        
        if (result.status === "success") {
            const list = document.getElementById('suggestionList'); 
            list.innerHTML = "";
            if (result.data && result.data.length > 0) {
                result.data.forEach(item => {
                    const div = document.createElement('div'); 
                    div.className = "suggestion-item"; 
                    div.innerHTML = `⚠️ <b>Tehlike:</b> ${item.tehlike} <br> 📉 <b>Risk:</b> ${item.risk} (O:${item.olasilik} Ş:${item.siddet}) <span>+ Ekle</span>`;
                    div.onclick = () => addRisk(item.tehlike, item.risk, item.olasilik, item.siddet); 
                    list.appendChild(div);
                });
                document.getElementById('aiSuggestions').style.display = "block";
            } else {
                alert("Bilgi: Görselde kurallara uygun risk tespit edilemedi.");
            }
        } else {
            alert("API Hatası: " + result.message);
        }
    } catch (e) { 
        alert("Bağlantı Hatası: Sunucuya ulaşılamıyor."); 
    } finally { 
        hideLoading();
    }
}

    // Önlem Ekleme Fonksiyonu
    function addGuvenlikOnlemi() {
        document.getElementById('guvenlikOnlemleriContainer').insertAdjacentHTML('beforeend', `
            <div class="dynamic-section">
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">Sil</button>
                <label>Mevcut Güvenlik Önlemleri Açıklaması</label>
                <textarea class="guvenlik-aciklama" rows="2" required placeholder="Giriş yapın..."></textarea>
                
                <label>Güvenlik Önlemi Fotoğrafı</label>
                <div class="photo-upload-widget">
                    <div class="photo-icon">📷</div>
                    <div style="flex:1"><div class="upload-text" style="font-weight:600; font-size:13px;">Fotoğraf Seç / Çek</div></div>
                    <input type="file" class="guvenlik-foto" accept="image/*" onchange="arayuzGuncelle(this)">
                </div>
                
                <label>Giderilen Riskler</label>
                <textarea class="giderilen-riskler" rows="2" required placeholder="Hangi riskleri engelliyor?"></textarea>
            </div>`);
    }

    // Risk Ekleme Fonksiyonu
    function addRisk(tehlikeText = "", riskText = "", olasilikVal = "", siddetVal = "") {
    const container = document.getElementById('risklerContainer');
    const id = Date.now();
    container.insertAdjacentHTML('beforeend', `
        <div class="dynamic-section" id="risk-section-${id}">
            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">Sil</button>
            <label>Mevcut Tehlike Açıklaması</label>
            <textarea class="tehlike-aciklama" rows="2" required placeholder="Giriş yapın...">${tehlikeText}</textarea>
            
            <label>Mevcut Risk Açıklaması</label>
            <textarea class="risk-aciklama" rows="2" required placeholder="Giriş yapın...">${riskText}</textarea>
            
            <label>Mevcut Risk Fotoğrafı</label>
            <div class="photo-upload-widget">
                <div class="photo-icon">📷</div>
                <div style="flex:1"><div class="upload-text" style="font-weight:600; font-size:13px;">Fotoğraf Seç / Çek</div></div>
                <input type="file" class="risk-foto" accept="image/*" onchange="arayuzGuncelle(this)">
            </div>
            
            <div class="row">
                <div class="col">
                    <label>Olasılık (1-5)</label>
                    <input type="number" class="olasilik-input" min="1" max="5" value="${olasilikVal}" oninput="hesaplaDinamikSkor(this)" required>
                </div>
                <div class="col">
                    <label>Şiddet (1-5)</label>
                    <input type="number" class="siddet-input" min="1" max="5" value="${siddetVal}" oninput="hesaplaDinamikSkor(this)" required>
                </div>
                <div class="col">
                    <label>Risk Skoru</label>
                    <input type="text" class="skor-input" readonly placeholder="-">
                </div>
            </div>
            
            <div class="row">
                <div class="col">
                    <label>Aksiyon Sorumlusu</label>
                    <input type="text" class="sorumlu-input" required placeholder="Ad Soyad">
                </div>
                <div class="col">
                    <label>Aksiyon Tarihi</label>
                    <input type="date" class="tarih-input" required>
                </div>
            </div>
        </div>`);
    
    const section = document.getElementById(`risk-section-${id}`);
    const olasilikInput = section.querySelector('.olasilik-input');
    hesaplaDinamikSkor(olasilikInput);
    
    if(tehlikeText) switchPage(3);
}

    // Skor Hesaplama Fonksiyonu
    function hesaplaDinamikSkor(el) {
        const sec = el.closest('.dynamic-section');
        const o = sec.querySelector('.olasilik-input').value;
        const s = sec.querySelector('.siddet-input').value;
        const sk = sec.querySelector('.skor-input');
        if(o && s) {
            const res = Math.min(5, Math.max(1, o)) * Math.min(5, Math.max(1, s));
            sk.value = res;
            if(res > 9) sk.classList.add('risk-yuksek'); else sk.classList.remove('risk-yuksek');
        } else {
            sk.value = '';
            sk.classList.remove('risk-yuksek');
        }
    }

    // Görsel İşleme (Base64 çevirme ve küçültme)
    async function processImage(file) {
        if (!file) return null;
        return new Promise((resolve) => {
            const reader = new FileReader(); 
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image(); 
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > 800) { h *= 800 / w; w = 800; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    // Formu Gönderme Fonksiyonu
    async function submitForm() {
        showLoading("Veriler Sisteme Kaydediliyor...");
        try {
            const fileEl = document.getElementById('postaFoto').files[0];
            const pFoto = fileEl ? await processImage(fileEl) : null;

            const payload = {
                departman: document.getElementById('departman').value,
                atolye: document.getElementById('atolye').value,
                uet: document.getElementById('uet').value,
                posta: document.getElementById('posta').value,
                postaFoto: pFoto,
                guvenlikOnlemleri: [], 
                riskler: []
            };

            const guvenlikNodes = document.querySelectorAll('#guvenlikOnlemleriContainer .dynamic-section');
            for (let sec of guvenlikNodes) {
                const gFile = sec.querySelector('.guvenlik-foto').files[0];
                payload.guvenlikOnlemleri.push({
                    aciklama: sec.querySelector('.guvenlik-aciklama').value,
                    giderilenRiskler: sec.querySelector('.giderilen-riskler').value,
                    foto: gFile ? await processImage(gFile) : null
                });
            }

            const riskNodes = document.querySelectorAll('#risklerContainer .dynamic-section');
            for (let sec of riskNodes) {
                const rFile = sec.querySelector('.risk-foto').files[0];
                payload.riskler.push({
                    tehlike: sec.querySelector('.tehlike-aciklama').value,
                    risk: sec.querySelector('.risk-aciklama').value,
                    olasilik: sec.querySelector('.olasilik-input').value,
                    siddet: sec.querySelector('.siddet-input').value,
                    skor: sec.querySelector('.skor-input').value,
                    sorumlu: sec.querySelector('.sorumlu-input').value,
                    tarih: sec.querySelector('.tarih-input').value,
                    foto: rFile ? await processImage(rFile) : null
                });
            }
            
            const res = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload),
                redirect: 'follow'
            });
            const result = await res.json();
            
            if (result.status === "success") { 
                alert("Analiz başarıyla kaydedildi."); 
                window.location.reload(); 
            } else {
                alert("Hata: " + result.message);
            }
        } catch (e) { 
            alert("Bağlantı hatası oluştu. Detay: " + e.message); 
        } finally { 
            hideLoading();
        }
    }

    // Uygulama açılışında 2. ve 3. sayfalara boş alanlar yükle
    window.onload = () => { 
        addGuvenlikOnlemi(); 
        addRisk(); 
    };
</script>
